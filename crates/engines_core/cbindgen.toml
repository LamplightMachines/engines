language = "C"
include_guard = "ENGINES_CORE_H"
autogen_warning = "/* Auto-generated by cbindgen from src/ffi.rs — do not edit by hand. */"
header = "/* engines_core C ABI (CE-R3.6). See doc/SRD_core_engine_v0.1.md + doc/decisions/0004. */"
cpp_compat = true
documentation = true
documentation_style = "c99"

[parse]
parse_deps = false

[export]
# Only export the FFI surface; internal types stay opaque. Exclude internal numeric
# consts cbindgen would otherwise leak as #defines.
prefix = ""
exclude = ["TWO_PI", "CONTROL_HOP", "DIM", "PI", "PHASE_TOLERANCE", "STRUCTURAL_LFO_MAX_HZ", "MAX_REALIGN_LOOPS", "PEAK_CEILING_DBFS", "DEFAULT_LUFS", "PAD_CENTER", "ORRERY_NOTE_LIMIT",
  # the param registry's curves (params.rs; Rust-only, ADR 0054)
  "Curve", "CUTOFF", "BAND", "ATTACK", "DECAY", "BELL_DECAY", "RELEASE", "VOICES_DETUNE", "OSC_B_DETUNE", "FM_INDEX", "T60",
  "RING_RATIO", "RESONANCE_Q", "DRIVE", "GAIN", "SHIFT", "PREDELAY", "OSC_B_RATIO", "ROOT_HZ", "SPREAD_HZ"]
