[package]
name = "engines_live"
version = "0.9.0"
edition.workspace = true
license.workspace = true
publish = false
description = "engines-live: the headless live player for a piece (ADR 0034/0036) — watches pieces/<slug>/<slug>.json5, applies every accepted save (snapshotted into .live/history), reports .live/status.json, and protects the speakers with a live-only limiter. A desktop shell over engines_core; NOT part of the portable core."

[dependencies]
engines_core = { path = "../engines_core", features = ["playback", "pieces", "stems"] }
# The lossless JSON5 CST (ADR 0037): the doc's instrument order (`LoopDoc` keys are sorted).
engines_authoring = { path = "../engines_authoring" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# CLI parsing (the clap arg-parser crate).
clap = { version = "4", features = ["derive"] }
# SPSC ring type handed to the output stream (same version as the core).
rtrb = "0.3"

[target.'cfg(unix)'.dependencies]
# SIGINT → a clean stop (status.json says "stopped").
libc = "0.2"

[[bin]]
name = "engines-live"
path = "src/main.rs"
