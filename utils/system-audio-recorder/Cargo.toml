[package]
name = "system-audio-recorder"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
description = "Record whatever macOS is playing (a Core Audio process tap) to a WAV until Enter."

# Standalone: not a member of the engine workspace (its own lockfile and target/).
[workspace]

[dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSObject", "NSArray", "NSDictionary", "NSString", "NSUUID", "NSValue"] }
objc2-core-audio = { version = "0.3", features = ["AudioHardware", "objc2-core-audio-types", "objc2-foundation", "block2", "dispatch2"] }
objc2-core-audio-types = { version = "0.3", features = ["CoreAudioBaseTypes"] }
objc2-core-foundation = { version = "0.3", features = ["CFString"] }
block2 = "0.6"
hound = "3.5"
ctrlc = "3.5"
